################
### MONITORS ###
################

monitor = DP-3, 1920x1080@144, 0x0, 1
monitor = DP-2, 1920x1080@144, 1920x0, 1
monitor = HDMI-A-1, 1920x1080@60, 960x-1080, 1

################
### PROGRAMS ###
################

$menu = rofi
$terminal = ghostty
$fileManager = thunar

#################
### AUTOSTART ###
#################

exec-once = hyprctl dispatch workspace 1
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie -t
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user start rclone-mount.service

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(c5c9c5ff) rgba(957fb8ff) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

group {
    col.border_active = rgba(c5c9c5ff) rgba(957fb8ff) 45deg
    col.border_inactive = rgba(595959aa)
    col.border_locked_active = rgba(c5c9c5ff) rgba(ffa066ff) 45deg
    col.border_locked_inactive = rgba(595959aa)

    groupbar {
        font_family = JetBrains Mono Nerd Font
        font_size = 14
        text_color = rgba(ffffffff)
        indicator_height = 0
        gradients = true
        height = 20
        gaps_out = 4
        gradient_rounding = 5
        col.active = rgba(595959ee)
        col.inactive = rgba(595959aa)
        col.locked_active = rgba(595959ee)
        col.locked_inactive = rgba(595959aa)
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    accel_profile = flat
}

device {
    name = logitech-usb-receiver
    sensitivity = 0.0
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# basic keybinds
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu -show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, G, togglegroup,
bind = $mainMod, H, changegroupactive,
bind = $mainMod, L, lockactivegroup, toggle
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# change focused window
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# move current window to a different position
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# move to a different workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move current window to a different workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# resize windows with the mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# media controls, requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# screenshots
bind = , print, exec, grim ~/Pictures/Screenshots/$(date +%m-%d-%Y_%s.png)
bind = CTRL, print, exec, grim -g "$(slurp -o)" ~/Pictures/Screenshots/$(date +%m-%d-%Y_%s.png)
bind = CTRL SHIFT, print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%m-%d-%Y_%s.png)

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = name:1, monitor:DP-3
workspace = name:2, monitor:DP-2
workspace = name:3, monitor:HDMI-A-1

windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$

# ignore maximize requests from apps
windowrule = suppressevent maximize, class:.*

# fix some dragging issues with xwayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# background blur for waybar
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar

# background blur for rofi
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = ignorealpha 0.5, rofi

# background blur for swaync
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

##############
### NVIDIA ###
##############

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

